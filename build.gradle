plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lily'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

// spring-boot 3.4 관리 버전(1.20)은 Docker Engine 29 에 너무 오래된 API 버전으로 붙어서 Docker 를 찾지 못한다
ext['testcontainers.version'] = '1.21.4'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.fabric8:kubernetes-client:6.13.5'
    // k3s kubeconfig(/etc/rancher/k3s/k3s.yaml) 의 EC 클라이언트 키를 읽는 데 필요 (없으면 기동 실패)
    runtimeOnly 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    // 스키마 마이그레이션과 롤백 (docs/schema-migration.md). 버전은 spring-boot 가 관리한다
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.fabric8:kubernetes-server-mock:6.13.5'
    // SQL 실행은 실제 DB 로 검증한다. Docker 가 없으면 해당 테스트는 건너뛴다
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:mysql'
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
    // Docker Desktop 은 npipe docker_engine 이 아니라 dockerDesktopLinuxEngine 을 쓴다.
    // 비어 있으면 Testcontainers 가 Docker 를 못 찾고 DB 테스트를 건너뛴다.
    def dockerHost = System.getenv('DOCKER_HOST')
    if (!dockerHost && org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        dockerHost = 'npipe:////./pipe/dockerDesktopLinuxEngine'
    }
    if (dockerHost) {
        environment 'DOCKER_HOST', dockerHost
    }
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('verifyLineCoverage') {
    group = 'verification'
    description = '라인 커버리지가 75%를 넘지 않으면 실패한다.'
    dependsOn tasks.named('jacocoTestReport')
    doLast {
        def report = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile
        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        factory.setFeature('http://apache.org/xml/features/nonvalidating/load-external-dtd', false)
        factory.setFeature('http://xml.org/sax/features/external-general-entities', false)
        factory.setFeature('http://xml.org/sax/features/external-parameter-entities', false)
        def doc = factory.newDocumentBuilder().parse(report)
        def counters = doc.documentElement.childNodes
        def covered = 0d
        def missed = 0d
        def found = false
        for (int i = 0; i < counters.length; i++) {
            def node = counters.item(i)
            if (node.nodeName == 'counter' && node.getAttribute('type') == 'LINE') {
                covered = node.getAttribute('covered').toDouble()
                missed = node.getAttribute('missed').toDouble()
                found = true
            }
        }
        if (!found) {
            throw new GradleException('JaCoCo 리포트에서 LINE 카운터를 찾지 못했다')
        }
        def total = covered + missed
        if (total == 0d) {
            throw new GradleException('JaCoCo 라인 커버리지를 계산할 수 없다')
        }
        def ratio = covered / total
        def percent = String.format('%.2f', ratio * 100d)
        logger.lifecycle("Line coverage: ${percent}% (${covered as int}/${total as int})")
        if (ratio <= 0.75d) {
            throw new GradleException("라인 커버리지 ${percent}% 는 75%를 넘겨야 한다")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyLineCoverage')
}

tasks.named('bootJar') { archiveFileName = 'app.jar' }
