# lily-cicd 를 k3s 에 올리는 매니페스트. 적용 방법은 같은 폴더의 README.md
#
# - 클러스터 안에서 돌기 때문에 kubeconfig 없이 ServiceAccount 로 k8s API 를 호출한다
# - 배포 요청마다 namespace 가 달라질 수 있어서 ClusterRole 로 권한을 준다.
#   코드가 쓰는 리소스(Deployment, Service, Ingress, 릴리스 기록 ConfigMap, DB 접속 정보 Secret, 배포 잠금 Lease)만 연다
# - 스키마 마이그레이션은 이 Pod 가 사용자 DB(RDS)에 직접 붙어 실행한다. worker 에서 돌고 RDS 보안 그룹이 worker 를 허용한다
# - 클러스터 내부 전용 (ClusterIP). lily-builder 는 http://lily-cicd.lily-system.svc 로 호출한다
apiVersion: v1
kind: Namespace
metadata:
  name: lily-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lily-cicd
  namespace: lily-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lily-cicd
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  # delete: canary 판정이 끝나면 {app}-canary-svc, {app}-canary-ingress 를 지운다. docs/canary-analysis.md
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "create", "update", "patch", "delete"]
  # canary 판정 중 새 Pod 재시작 확인
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # 슬롯별 마이그레이션 스크립트 보관 ({app}-{slot}-schema). docs/schema-migration.md
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "delete"]
  # 슬롯별 DB 접속 정보 ({app}-{slot}-db). Deployment 스펙에 비밀번호를 평문으로 두지 않으려고 쓴다
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
  # 같은 앱의 배포·롤백 직렬화 (lily-lock-{app})
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lily-cicd
subjects:
  - kind: ServiceAccount
    name: lily-cicd
    namespace: lily-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lily-cicd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lily-cicd
  namespace: lily-system
  labels:
    app: lily-cicd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lily-cicd
  template:
    metadata:
      labels:
        app: lily-cicd
    spec:
      serviceAccountName: lily-cicd
      terminationGracePeriodSeconds: 30
      containers:
        - name: lily-cicd
          # ECR 에 올린 이미지로 바꾼다
          image: <ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/lily-cicd:latest
          ports:
            - name: http
              containerPort: 8090
          env:
            # lily-db-provisioner 연동. 두 값을 빼면 DB 없이 배포한다 (NoopDatabaseProvisioner)
            - name: LILY_DATABASE_PROVISIONER_URL
              value: http://db-provisioner.lily-system.svc
            - name: LILY_DATABASE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  # lily-db-provisioner 배포 때 만든 Secret 의 토큰을 같이 쓴다
                  name: db-provisioner-env
                  key: PROVISIONER_API_TOKEN
            # 배포 전략: blue-green 또는 canary
            - name: LILY_DEPLOY_STRATEGY
              value: blue-green
            # 앱 주소 https://{app}.apps.lilycloud.kr. *.apps.lilycloud.kr → lily-alb (ACM 인증서) → ingress-nginx
            - name: LILY_DEPLOY_DOMAIN
              value: apps.lilycloud.kr
            - name: LILY_DEPLOY_URL_SCHEME
              value: https
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
          # actuator 가 없어서 포트가 열렸는지로 판단한다
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: lily-cicd
  namespace: lily-system
spec:
  type: ClusterIP
  selector:
    app: lily-cicd
  ports:
    - name: http
      port: 80
      targetPort: http
