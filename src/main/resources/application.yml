spring:
  application:
    name: lily-cicd
  mvc:
    async:
      # 배포는 readiness 대기(최대 120초)까지 포함해 오래 걸린다. 기본값(30초)이면 배포 중에 503 을 돌려준다.
      # lily-builder 의 읽기 타임아웃(300초)보다 짧게 둬서 결과가 builder 에 먼저 도착하게 한다
      request-timeout: 290s

server:
  # lily-blog-sample 로컬 포트(8080)와 겹치지 않게 둔다.
  port: 8090

lily:
  deploy:
    app-name: lily
    namespace: default
    domain: domain.com
    # lily-blog-sample 은 '/' 와 '/health' 가 없다. Actuator readiness 가 트래픽 기준이다.
    readiness-path: /actuator/health/readiness
    liveness-path: /actuator/health/liveness
    readiness-timeout-seconds: 120
    # blue-green 또는 canary. 다른 DeploymentStrategy 빈이 있으면 그 빈이 우선한다.
    strategy: blue-green
    # canary 일 때 새 버전이 받는 비율. 파드 5개 중 이 비율만큼 canary 에 둔다.
    canary-weight-percent: 20
