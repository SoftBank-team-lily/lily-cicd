spring:
  application:
    name: lily-cicd
  mvc:
    async:
      # 배포는 스키마 마이그레이션과 readiness 대기(최대 120초)까지 포함해 오래 걸린다. 기본값(30초)이면 배포 중에 503 을 돌려준다.
      # lily-builder 의 읽기 타임아웃(420초)보다 짧게 둬서 결과가 builder 에 먼저 도착하게 한다
      request-timeout: 400s
  # flyway 는 배포 요청마다 사용자 DB 에 직접 붙여 쓴다 (SchemaMigrator). 이 서버에는 DB 가 없다
  flyway:
    enabled: false

server:
  # lily-blog-sample 로컬 포트(8080)와 겹치지 않게 둔다.
  port: 8090

lily:
  deploy:
    app-name: lily
    namespace: default
    domain: domain.com
    # 배포 결과 주소의 scheme. Cloudflare 가 TLS 를 끝내는 도메인이면 https
    url-scheme: http
    # lily-blog-sample 은 '/' 와 '/health' 가 없다. Actuator readiness 가 트래픽 기준이다.
    readiness-path: /actuator/health/readiness
    liveness-path: /actuator/health/liveness
    readiness-timeout-seconds: 120
    # 슬롯 replica. 1 이면 Pod 하나가 죽는 동안 그 앱이 다운된다
    replicas: 2
    # selector 전환 뒤 이전 슬롯을 내리기 전 대기(초). Pod preStop 도 같은 값
    drain-seconds: 5
    # blue-green 또는 canary. 다른 DeploymentStrategy 빈이 있으면 그 빈이 우선한다.
    strategy: blue-green
    # canary 일 때 입구 비율을 올리는 칸(%). 양쪽 replica 는 유지하고 0 에서 이 값씩 100 까지 간다.
    canary-weight-percent: 20
    # 한 칸을 유지하는 시간(초). 0 이면 다음 칸으로 바로 간다.
    canary-step-seconds: 30
    # 블루그린 전환 전 canary 판정. 이전 버전이 떠 있을 때만 한다. docs/canary-analysis.md
    canary-analysis:
      enabled: true
      weight-percent: 10
      duration-seconds: 30
      interval-millis: 250
      request-timeout-millis: 2000
      max-error-rate: 0.05
      max-p95-millis: 1000
      max-p95-ratio: 2.0
      min-p95-regression-millis: 100
      min-samples: 20
  # 무중단 스키마 변경 (앱 레포 db/pgroll/*.yaml)
  schema:
    pgroll:
      binary: pgroll
      # RDS 는 require, 로컬 Postgres 컨테이너는 disable
      sslmode: ${PGROLL_SSLMODE:require}
      lock-timeout-millis: 500
      timeout-seconds: 300
      backfill-batch-size: 1000
      backfill-batch-delay: 0s
      # 전환 뒤 이 시간 동안은 앱과 스키마를 데이터 손실 없이 되돌린다. 지나면 complete
      rollback-window-seconds: ${PGROLL_ROLLBACK_WINDOW_SECONDS:600}
      completer-interval-seconds: 30
